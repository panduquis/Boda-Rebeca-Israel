<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5efe6">

  <title>Save the Date | Isra & Rebe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #fffaf3 0%, #f4ede3 50%, #e9ded0 100%);
      color: #352e2a;
      font-family: Arial, Helvetica, sans-serif;
    }

    .video-page {
      width: min(920px, calc(100% - 30px));
      min-height: 100vh;
      margin: auto;
      padding: 40px 0 50px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8b7565;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.8rem, 10vw, 5.5rem);
      line-height: 1;
      font-weight: 400;
    }

    .names {
      margin: 12px 0 30px;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: clamp(1.15rem, 4vw, 1.5rem);
      color: #78665a;
    }

    .video-wrapper {
      width: 100%;
      max-width: 760px;
      overflow: hidden;

      border-radius: 24px;
      background: #000;

      box-shadow:
        0 22px 60px rgba(52, 42, 35, 0.18),
        0 4px 15px rgba(52, 42, 35, 0.12);
    }

    .video-wrapper iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    .message {
      max-width: 600px;
      margin: 28px auto 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #66574d;
    }

    .close-text {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #9b897c;
    }

    @media (max-width: 600px) {
      .video-page {
        width: calc(100% - 22px);
        padding: 28px 0 40px;
      }

      .video-wrapper {
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="video-page">

    <p class="eyebrow">Nuestra historia continúa</p>

    <h1>Save the Date</h1>

    <p class="names">
      Isra &amp; Rebe
    </p>

    <div class="video-wrapper">

      <iframe
        src="https://www.youtube-nocookie.com/embed/WvT2UL9PaAo"
        title="Save the Date - Isra y Rebe"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>

    </div>

    <p class="message">
      Hay momentos que cambian nuestra historia para siempre.
      Estamos muy felices de compartir uno de ellos contigo.
    </p>

    <p class="close-text">
      Puedes cerrar esta pestaña para regresar a tu invitación.
    </p>

  </main>

</body>
</html>
